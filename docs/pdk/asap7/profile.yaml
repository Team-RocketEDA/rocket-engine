# PDK-ASAP7 lane profile: ASAP7 predictive 7nm FinFET (ASU+ARM, BSD-3).
# SPIKE-FIRST lane: gdsfactory does not cover ASAP7 (verified: no
# refs in installed gdsfactory, engine api-map, or the upstream PDK
# list), so proofs bypass the engine gdsfactory adapter and verify
# the pre-cloned trees directly (stdlib parsing + KLayout batch +
# 7z). All matrix rows are predictive-only, never manufacturable,
# and must never look better-proven than measured silicon.
