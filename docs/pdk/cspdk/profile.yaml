    status: proven
    tech:
      klayout_dir: cspdk/si340/klayout
      lyt: cspdk/si340/klayout/tech.lyt
      lyp: cspdk/si340/klayout/layers.lyp
      layers_yaml: cspdk/si340/layers.yaml
      tech_name: Cornerstone_si340
      quirks:
        - "cspdk.si340.config.PATH.lyp/lyt point at klayout/tech/*, which does not exist; real files sit directly under klayout/"
        - "upstream install_tech.py links si220 + sin300 only; si340 needs the manual symlink in recipe.md"
    drc:
      deck: null
      deck_reason: si340 ships tech.lyt + layers.lyp but no runnable local deck; upstream DRC runs through the gdsfactoryplus cloud workflow (needs GFP_API_KEY), which the engine must never touch. The engine KLayout batch rules below stand in.
      engine_rules:
        - layer: [3, 0]
          width_um: 0.35
          space_um: 0.2
          name: si340_WG
          ref: CORNERSTONE-49th-Call-Design-Guidelines-1.pdf section 5.3-5.4 Table 4 (GDS 3/0 min feature 350 nm, min gap 200 nm)
    models:
      path: cspdk/si340/models.py
      registry: get_models
      count: 39
      status: proven
