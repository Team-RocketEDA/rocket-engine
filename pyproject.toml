[project]
name = "rocket-engine"
version = "0.0.1"
description = "Shared tooling engine used by the RocketEDA IDE (manual actions and MCP invoke the same operations)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "anyio>=4.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "mcp>=1.0,<3",
  "pydantic>=2.0",
  "pyyaml>=6",
  "ruamel.yaml>=0.18",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]
# Optional solver profiles (see README "Tool & dependency decisions").
# Base `uv sync` stays lean; add per profile, e.g. `uv sync --group photonic`.
hdl = [
  "amaranth>=0.5.10",
  "cocotb>=1.9",
  "pyslang>=12.1.0",
  "pywellen>=0.25.7",
  "vlsirtools>=7.0.0",
]
analog = [
  "PySpice>=1.5",
  "cace==2.13.0",
  "devsim==2.11.2",
  "matplotlib>=3.8",
  "scikit-rf>=1.0",
]
photonic = [
  "sax>=0.18",
  "circulax",
  "meow-sim>=0.15",
]
layout = [
  # <10: stay on stable 9.x; 10.x needs its own qualification (PDK pins differ).
  # gdsfactory parents kfactory~=3.0.4 (its layout backend) + kfnetlist transitively.
  "gdsfactory>=9.51,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ IS the engine root: its contents install as the `rocket_engine`
# package. There is no nested package directory and no UI code anywhere
# under src/. The generated api-schema.json ships as MCP adapter
# package data (MCP-SCHEMA wire source; never hand-edited).
force-include = {"src" = "rocket_engine", "docs/api-schema.json" = "rocket_engine/adapters/mcp/api-schema.json"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rocket_engine"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

# The package is built from src/ (not editable), so uv must rebuild when source
# changes; by default it only watches pyproject.toml and a pull would run old code.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "docs/api-schema.json" }]
