# Slow RC step (CIRCULAX-LIVE proof as an op fixture): 100k/1nF, tau=100us.
# Proven smoke numbers: Vc(5us)=0.0488 — misses the 0.9 V @5us threshold.
circuit: rc-step-slow
instances:
  V1: {component: vsource, settings: {V: 1.0}}
  R1: {component: resistor, settings: {R: 100000.0}}
  C1: {component: capacitor, settings: {C: 1.0e-9}}
  GND: {component: ground}
connections:
  V1,p1: R1,p1
  V1,p2: GND,p1
  R1,p2: C1,p1
  C1,p2: GND,p1
transient: {t1_s: 5.0e-6, points: 11, dt0_s: 1.0e-8, observe: "C1,p1"}
targets:
  - {at_s: 5.0e-6, min_V: 0.9}
